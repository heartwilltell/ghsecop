# Default values for ghsecop.

replicaCount: 1

image:
  repository: ghcr.io/heartwilltell/ghsecop
  tag: "" # defaults to chart appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # name: ""  # defaults to fullname

rbac:
  create: true

# Operator runtime flags
leaderElect: true
pollingInterval: 10m
metrics:
  bindAddress: ":8080"
health:
  bindAddress: ":8081"
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10

# Credentials for 1Password Connect and GitHub.
# Prefer existingSecret in production; inline values create a chart-managed Secret.
credentials:
  # Name of an existing secret with keys OP_CONNECT_HOST, OP_CONNECT_TOKEN, GITHUB_TOKEN.
  # When set, the chart will not create a Secret.
  existingSecret: ""

  # Used only when existingSecret is empty.
  create: true
  connectHost: "http://onepassword-connect.default.svc.cluster.local:8080"
  connectToken: ""
  githubToken: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

terminationGracePeriodSeconds: 10

# Optional GitHubSecretSync resources created with the release.
# Example:
# syncs:
#   - name: secure-node
#     itemPath: vaults/Infrastructure/items/secure-node
#     github:
#       organization: my-org
#     secretNamePrefix: OP
#     syncIntervalSeconds: 300
syncs: []
