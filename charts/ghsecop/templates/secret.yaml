{{- if and .Values.credentials.create (empty .Values.credentials.existingSecret) }}
{{- if or (empty .Values.credentials.connectToken) (empty .Values.credentials.githubToken) }}
{{- fail "credentials.connectToken and credentials.githubToken are required when credentials.existingSecret is not set. Set them via --set or --set-file, or provide credentials.existingSecret." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ghsecop.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ghsecop.labels" . | nindent 4 }}
type: Opaque
stringData:
  OP_CONNECT_HOST: {{ .Values.credentials.connectHost | quote }}
  OP_CONNECT_TOKEN: {{ .Values.credentials.connectToken | quote }}
  GITHUB_TOKEN: {{ .Values.credentials.githubToken | quote }}
{{- end }}
