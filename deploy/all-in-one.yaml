    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ghsecop-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ghsecop-manager-role
subjects:
  - kind: ServiceAccount
    name: ghsecop-controller-manager
    namespace: ghsecop-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ghsecop-leader-election-role
  namespace: ghsecop-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ghsecop-leader-election-rolebinding
  namespace: ghsecop-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ghsecop-leader-election-role
subjects:
  - kind: ServiceAccount
    name: ghsecop-controller-manager
    namespace: ghsecop-system
---
apiVersion: v1
kind: Secret
metadata:
  name: ghsecop-credentials
  namespace: ghsecop-system
type: Opaque
stringData:
  OP_CONNECT_HOST: "http://onepassword-connect.default.svc.cluster.local:8080"
  OP_CONNECT_TOKEN: "REPLACE_WITH_CONNECT_TOKEN"
  GITHUB_TOKEN: "REPLACE_WITH_GITHUB_TOKEN"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghsecop-controller-manager
  namespace: ghsecop-system
  labels:
    app.kubernetes.io/name: ghsecop
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: ghsecop
  template:
    metadata:
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: ghsecop
    spec:
      serviceAccountName: ghsecop-controller-manager
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: ghcr.io/heartwilltell/ghsecop:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --polling-interval=10m
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          env:
            - name: OP_CONNECT_HOST
              valueFrom:
                secretKeyRef:
                  name: ghsecop-credentials
                  key: OP_CONNECT_HOST
            - name: OP_CONNECT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ghsecop-credentials
                  key: OP_CONNECT_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ghsecop-credentials
                  key: GITHUB_TOKEN
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 10
