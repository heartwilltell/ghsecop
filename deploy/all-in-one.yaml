                    type: string
                secretNamePrefix:
                  type: string
                syncIntervalSeconds:
                  type: integer
                  format: int64
                  minimum: 30
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                itemVersion:
                  type: integer
                lastSyncedFields:
                  type: array
                  items:
                    type: string
                syncedRepositories:
                  type: integer
                lastSyncTime:
                  type: string
                  format: date-time
                conditions:
