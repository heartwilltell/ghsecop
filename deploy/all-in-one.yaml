---
apiVersion: v1
kind: Namespace
metadata:
  name: ghsecop-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ghsecop-controller-manager
  namespace: ghsecop-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ghsecop-manager-role
rules:
  - apiGroups: ["ghsecop.io"]
    resources: ["githubsecretsyncs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["ghsecop.io"]
    resources: ["githubsecretsyncs/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["ghsecop.io"]
    resources: ["githubsecretsyncs/finalizers"]
    verbs: ["update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
