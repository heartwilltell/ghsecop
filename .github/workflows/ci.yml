name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: make test
      - name: Build
        run: make build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint chart
        run: |
          helm lint ./charts/ghsecop \
            --set credentials.connectToken=dummy \
            --set credentials.githubToken=dummy
      - name: Template chart
        run: |
          helm template ghsecop ./charts/ghsecop \
            --namespace ghsecop-system \
            --set credentials.connectToken=dummy \
            --set credentials.githubToken=dummy \
            >/dev/null
