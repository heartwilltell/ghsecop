apiVersion: ghsecop.io/v1
kind: GitHubSecretSync
metadata:
  name: secure-node
  namespace: default
spec:
  # Same path shape as the official 1Password OnePasswordItem CRD.
  itemPath: vaults/Infrastructure/items/secure-node

  # Sync every field on that 1Password item to Actions secrets in every
  # (non-archived, non-fork) repository under this GitHub organization.
  github:
    organization: my-org
    # Optional: limit to specific repos instead of the whole org
    # repositories:
    #   - api
    #   - web
    # Optional: skip some repos when syncing the whole org
    # excludeRepositories:
    #   - sandbox
    # includeArchived: false
    # includeForks: false

  # Optional: only sync these field labels (default = all non-empty fields)
  # fields:
  #   - username
  #   - password
  #   - api_token

  # Optional prefix for GitHub Actions secret names (field "password" -> "OP_PASSWORD")
  secretNamePrefix: OP

  # Optional per-resource Connect poll interval (seconds, min 30)
  syncIntervalSeconds: 300
