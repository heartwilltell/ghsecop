---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: githubsecretsyncs.ghsecop.io
spec:
  group: ghsecop.io
  names:
    kind: GitHubSecretSync
    listKind: GitHubSecretSyncList
    plural: githubsecretsyncs
    shortNames:
      - ghss
    singular: githubsecretsync
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Vault/Item
          type: string
          jsonPath: .spec.itemPath
        - name: Org
          type: string
          jsonPath: .spec.github.organization
        - name: Repos
          type: integer
          jsonPath: .status.syncedRepositories
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: GitHubSecretSync declares a 1Password item whose fields should be synced into GitHub Actions repository secrets for an organization.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - itemPath
                - github
              properties:
                itemPath:
                  description: '1Password item path: vaults/<vault_id_or_title>/items/<item_id_or_title>'
                  type: string
                  pattern: '^vaults/[^/]+/items/[^/]+$'
                github:
                  type: object
                  required:
                    - organization
                  properties:
                    organization:
                      type: string
                      minLength: 1
                    repositories:
                      description: Limit sync to these repository names. Empty means all org repos.
                      type: array
                      items:
                        type: string
                    excludeRepositories:
                      description: Repository names to skip when syncing the whole organization.
                      type: array
                      items:
                        type: string
                    includeArchived:
                      type: boolean
                    includeForks:
                      type: boolean
                fields:
                  description: Optional allowlist of 1Password field labels. Empty syncs all non-empty fields.
                  type: array
                  items:
                    type: string
                secretNamePrefix:
                  description: Optional prefix prepended to each GitHub Actions secret name.
                  type: string
                syncIntervalSeconds:
                  description: Per-resource Connect polling interval override (minimum 30).
                  type: integer
                  format: int64
                  minimum: 30
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                itemVersion:
                  type: integer
                lastSyncedFields:
                  type: array
                  items:
                    type: string
                syncedRepositories:
                  type: integer
                lastSyncTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
